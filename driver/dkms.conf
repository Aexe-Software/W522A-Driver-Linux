# DKMS configuration for w1-aml WiFi driver
# Chip: Amlogic W155S1 / Fn-Link K255B-SR (X96 Max Plus)
PACKAGE_NAME="w1-aml"
PACKAGE_VERSION="1.8.0-armbian"
CLEAN="make clean"
MAKE[0]="make KDIR=/lib/modules/${kernelver}/build"
BUILT_MODULE_NAME[0]="aml_sdio"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/updates/w1-aml/"
BUILT_MODULE_NAME[1]="vlsicomm"
BUILT_MODULE_LOCATION[1]="."
DEST_MODULE_LOCATION[1]="/updates/w1-aml/"
AUTOINSTALL="yes"
