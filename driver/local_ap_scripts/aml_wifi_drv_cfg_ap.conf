# ============================================================================
#  W522A / W155S1  —  AP role config  (ФІНАЛЬНА КОНФІГУРАЦІЯ)
# ============================================================================
#
#  !!!  TX-АГРЕГАЦІЯ (A-MPDU) ВИМКНЕНА — БАГ ПРОШИВКИ. НЕ ВМИКАТИ.  !!!
#  !!!  TX AGGREGATION (A-MPDU) DISABLED — FIRMWARE BUG. DO NOT ENABLE.  !!!
#
#  Прошивка W155S1 ВІШАЄ чіп при передачі агрегованих даних у режимі точки
#  доступу: ARC-ядро фолтить -> SDIO вмирає -> watchdog перезавантажує приставку.
#  Перевірено на VHT80 і HT40, при будь-якому бюджеті TX-сторінок. Це баг
#  бінарної прошивки Amlogic, з драйвера НЕ обходиться (ADDBA узгоджується, але
#  передача агрегованих даних вішає чіп).
#
#  ВАЖЛИВО: рядки нижче лишати рівно = 0. НЕ видаляти і НЕ коментувати —
#  вбудований дефолт cfg_txaggr=1, тож закоментований рядок знову увімкне баг!
#
#  RX-агрегація (приймання) ПРАЦЮЄ і лишається увімкненою — дає швидку вигрузку.
# ----------------------------------------------------------------------------

# --- TX A-MPDU / A-MSDU: вимкнено через баг прошивки. НЕ ЧІПАТИ ---
cfg_ap_txaggr=0
cfg_txaggr=0
cfg_ap_vht80_txaggr=0
cfg_txamsdu=0

# --- RX A-MPDU: працює коректно, лишити увімкненим ---
cfg_ap_rxaggr=1
cfg_rxaggr=1
cfg_ap_ampdu_ht20_limit=16
cfg_ap_ampdu_wide_limit=16
cfg_ap_ampdu_wait_target=1
cfg_ap_rx_reorder_timeout=10
cfg_ap_rx_ba_window=16

# --- інше ---
cfg_disable_fw_sleep=1
cfg_vhtsupport=1
