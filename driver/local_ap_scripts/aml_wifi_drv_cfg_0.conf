# W522A base profile - loaded first for all modes.
# Role-specific overrides are loaded after this file:
#   aml_wifi_drv_cfg_ap.conf
#   aml_wifi_drv_cfg_sta.conf
#   aml_wifi_drv_cfg_monitor.conf

cfg_band = 6
cfg_txpowlimit = 20
cfg_mac_mode = 5
cfg_40Msupport = 1
cfg_dynamic_bw = 0
cfg_burst_ack = 1
cfg_disable_fw_sleep = 1
cfg_hrtimer_interval = 1
cfg_listen_interval = 1
cfg_retry_limit = 7
cfg_wifi_bt_coexist_support = 1
cfg_txaggr=0
cfg_rxaggr=1

# Never enable A-MSDU on this box; it stalls the SDIO path under load.
cfg_txamsdu = 0

# Conservative common AMPDU defaults. Role files may override their own knobs.
cfg_ampdu_subframes = 8
cfg_ampdu_limit = 65535
cfg_rx_ba_window = 64
cfg_rx_reorder_timeout = 1
