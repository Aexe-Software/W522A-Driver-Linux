# W522A 5GHz AP — VHT80 (80 MHz). Дає ~70/112 Мбіт на лінку проти ~9/13 на 40MHz.
# TX-агрегація вимкнена у драйвері (баг прошивки), RX-агрегація працює.
interface=w522a
driver=nl80211
ssid=W522A_5G
country_code=US
ieee80211d=1
hw_mode=a
channel=36
ieee80211n=1
ieee80211ac=1
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]
vht_capab=[SHORT-GI-80]
vht_oper_chwidth=1
vht_oper_centr_freq_seg0_idx=42
wmm_enabled=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP
wpa_passphrase=12345678
wpa_group_rekey=0
uapsd_advertisement_enabled=1
dtim_period=1
beacon_int=100
ap_isolate=0
