# W522A AP role overrides — TUNED for the W155S1 firmware TX-page budget.
#
# The chip has ~224 TX pages in the ARC core's small RAM. Aggressive 80 MHz
# A-MPDU (vht80_txaggr=1 + wide window 64) overflows that pool and triggers the
# firmware watchdog ("page free overflow" / "tx stall") -> connect_repair
# re-init storm (audible coil whine, log flood, throughput collapse).
# These values aggregate on HT to beat the ~9 Mbit un-aggregated floor while
# staying inside the firmware page budget. Raise wide_limit cautiously
# (24, 32, ...) ONLY while watching `dmesg` for "tx stall".

# AP TX A-MPDU is DISABLED: this W155S1 firmware fails AP-side TX aggregation
# outright (txba quarantine code=4:FW_END_FAIL even with a 16-frame window),
# producing an endless ADDBA->fail->3s-cooldown churn and, under load, a USB
# xHCI death + watchdog reboot. RX aggregation is fine and stays on. Without
# TX aggregation the AP is stable; throughput is limited but the box no longer
# reboots. This is a firmware limitation, not a tunable.
cfg_ap_txaggr=0
cfg_txaggr=0

cfg_ap_rxaggr=1
cfg_rxaggr=1

# VHT80 TX A-MPDU OFF — this is the page-overflow culprit on this firmware.
# HT20/HT40 TX block-ack stays enabled; RX BA stays enabled.
cfg_ap_vht80_txaggr=0

# Moderate AMPDU windows. CRITICAL: cfg_ap_rx_ba_window MUST match the TX
# limits. It was 64 — that made the AP grant a 64-frame RX Block-Ack window to
# clients (ADDBA-Rsp baw=64), so clients aggregated 64 MPDUs toward us and the
# RX reorder buffer + firmware page pool overflowed within ~1s of load -> hard
# TX wedge (0 Mbit, ping still answers). All windows now 16, consistent with
# cfg_ap_ampdu_wide_limit, so the negotiated BA window, burst limit and the
# firmware page budget agree. Raise all three together (24, 32...) ONLY while
# watching dmesg, never rx_ba_window alone.
cfg_ap_ampdu_ht20_limit=16
cfg_ap_ampdu_wide_limit=16
cfg_ap_ampdu_wait_target=1
cfg_ap_rx_reorder_timeout=10
cfg_ap_rx_ba_window=16
cfg_txamsdu=0
cfg_disable_fw_sleep=1

# VHT rates (high PHY rate, single-frame) are fine; only VHT80 *aggregation*
# overflows pages. Keep VHT capability on.
cfg_vhtsupport=1
