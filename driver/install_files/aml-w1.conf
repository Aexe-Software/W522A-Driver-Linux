# W522A — Amlogic W155S1 / Fn-Link K255B-SR
# Installed to /etc/modprobe.d/aml-w1.conf
#
# vlsicomm (WiFi MAC) uses symbols exported by aml_sdio (the SDIO bus driver),
# so aml_sdio must be loaded first. depmod records this dependency from the
# symbol table; the softdep below makes the order explicit and also applies
# when vlsicomm is modprobed manually.
softdep vlsicomm pre: aml_sdio

# --- Optional aml_sdio tunables (defaults shown; uncomment to change) ---
# SDIO fairness: yield the CPU after N reads/writes so BT/host stay responsive
# under heavy WiFi DMA. 0 disables the yield.
#options aml_sdio sdio_read_yield_burst=4 sdio_write_yield_burst=4
#options aml_sdio sdio_yield_min_us=25 sdio_yield_max_us=30
#
# Host-wake OOB GPIO IRQ — only relevant for a USE_GPIO_IRQ=1 build. This build
# uses the in-band SDIO DAT1 IRQ, so these are normally ignored.
#options aml_sdio wifi_oob_hwirq=71 wifi_oob_irqtype=8
