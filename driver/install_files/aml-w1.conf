# /etc/modprobe.d/aml-w1.conf
# w1-aml WiFi driver: Amlogic W155S1 / Fn-Link K255B-SR
#
# Make `modprobe aml_sdio` automatically pull in the upper-layer
# WiFi stack module `vlsicomm` afterwards, so the SDIO hotplug
# event from udev is enough to bring the WiFi interface up.
softdep aml_sdio post: vlsicomm

# Default module parameters. Uncomment + edit as needed.
#
# Interface name template. By default this driver registers the
# primary VIF as the literal "w522a" (no %d) so it does NOT compete
# for wlan0/wlan1 with other in-tree wifi drivers (mt7601u, etc.).
# If you need legacy auto-numbered wlanN names instead, set:
#options vlsicomm vmac0=wlan%d vmac1=p2p%d
#
# Single VIF mode (1 = STA only, 0 = STA + P2P):
#options vlsicomm single_vif=1
# MAC address override (set CC for last byte to use chip-default):
#options vlsicomm mac_addr="00:01:02:58:00:CC"
# Country code for regulatory domain:
#options vlsicomm country_code="WW"
